[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gtfs-validator"
version = "0.1.1"
description = "Pure-Python validator for the canonical GTFS rule set. No JVM, no dependencies."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
license = "MIT"
keywords = ["gtfs", "transit", "validator", "gtfs-schedule", "mobilitydata"]

license-files = ["LICENSE", "NOTICE"]

# The README opens by stating that this is an unaffiliated reimplementation that
# shares upstream's name, and `readme` is what puts that paragraph on the PyPI
# project page. A blank page next to a name this close to someone else's is the
# thing worth avoiding.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    # Only the interpreters the suite has actually been run on. 3.12 is in range
    # and almost certainly fine; it is absent because nobody has run it, and a
    # classifier is a claim.
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Software Development :: Quality Assurance",
]

# 0.1.0 went out without these, so its project page carries no link to the source,
# the issue tracker or anything else, and a PyPI release is immutable: the only fix
# was the next version. The sidebar is built from this table alone.
[project.urls]
Homepage = "https://github.com/veodyn/gtfs-validator"
Repository = "https://github.com/veodyn/gtfs-validator"
Issues = "https://github.com/veodyn/gtfs-validator/issues"

[project.scripts]
gtfs-validator = "gtfs_validator.cli:main"

[project.optional-dependencies]
# `coverage` rather than `pytest-cov` because the differential harnesses are shell
# and script entry points, not pytest runs, and `coverage run` measures those too.
dev = ["pytest>=8", "ruff>=0.6", "build>=1", "twine>=5", "coverage>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gtfs_validator = ["data/*.json", "data/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
# Configured here rather than passed on the command line so a local run and the CI
# floor measure the same denominator. Without this, `coverage run -m pytest` counts
# the test files themselves, which are near-100% by construction and would inflate
# the total by enough to hide a real drop in src/.
source = ["src/gtfs_validator"]
branch = true

[tool.coverage.report]
exclude_also = [
    # Neither runs under the suite, and counting them as missed lines makes the
    # number a worse signal rather than a stricter one.
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
